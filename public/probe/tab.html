<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>JorGu tab test</title>
<style>
  body { font: 18px -apple-system, sans-serif; background: #111; color: #eee; padding: 20px; }
  button { font-size: 22px; padding: 18px 26px; border-radius: 14px; border: 0; background: #4da3ff; color: #000; }
  #log { margin-top: 18px; white-space: pre-wrap; line-height: 1.5; }
</style>
</head>
<body>
<!-- Test (2026-11-17): can a page in the car browser open a youtube.com tab and close it again by itself? -->
<p>แตะปุ่ม แล้วรอ 10 วินาที อย่าแตะอะไร</p>
<button id="go">ทดสอบเปิดแท็บ YouTube</button>
<div id="log"></div>
<script>
  const log = (m) => { document.getElementById('log').textContent += new Date().toLocaleTimeString() + '  ' + m + '\n'; };
  log('หน้านี้โหลดแล้ว');
  document.getElementById('go').onclick = () => {
    let w = null;
    try { w = window.open('https://www.youtube.com/watch?v=M7lc1UVf-VE', '_blank'); } catch (e) { log('เปิดไม่ได้: ' + e); }
    log(w ? 'ผล 1: สั่งเปิดแท็บใหม่ได้' : 'ผล 1: เปิดแท็บใหม่ไม่ได้ (แอปไม่รองรับ)');
    if (!w) return;
    setTimeout(() => {
      try { w.close(); } catch (e) { log('ปิดไม่ได้: ' + e); }
      setTimeout(() => log(w.closed ? 'ผล 2: ปิดแท็บเองได้ กลับมาหน้านี้แล้ว' : 'ผล 2: ปิดแท็บเองไม่ได้'), 500);
    }, 6000);
  };
</script>
</body>
</html>
